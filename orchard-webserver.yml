---
- name: Configure Orchard as Web Server
  hosts: orchard
  become: true

  tasks:

    - name: Mount RHEL DVD to /mnt
      ansible.posix.mount:
        path: /mnt
        src: /dev/sr0
        fstype: iso9660
        opts: ro
        state: mounted

    - name: Create local RHEL repository
      ansible.builtin.yum_repository:
        name: rhel-local
        description: Local RHEL DVD Repository
        baseurl: file:///mnt
        enabled: true
        gpgcheck: false

    - name: Install Apache HTTP server
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Allow HTTP service through firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: Start and enable Apache
      ansible.builtin.systemd:
        name: httpd
        state: started
        enabled: true
