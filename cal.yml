---
    - name: Create a functioning web calculator page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Server: jurong - Calculator</title>
              <style>
                  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f4f9; }
                  h1 { color: #333; margin-bottom: 5px; }
                  h3 { color: #666; margin-top: 0; }
                  .calculator { border: 1px solid #ccc; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
                  #display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 15px; padding: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
                  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
                  button { padding: 20px; font-size: 18px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 5px; }
                  button:hover { background: #d4d4d4; }
                  button.operator { background: #ff9f0a; color: white; }
                  button.operator:hover { background: #cc7f08; }
                  button.clear { background: #a5a5a5; color: white; }
                  button.clear:hover { background: #8e8e8e; }
              </style>
          </head>
          <body>
              <h1>Server: jurong</h1>
              <h3>Web Calculator</h3>
              <div class="calculator">
                  <input type="text" id="display" readonly>
                  <div class="buttons">
                      <button class="clear" onclick="clearDisplay()">C</button>
                      <button onclick="appendValue('/')" class="operator">/</button>
                      <button onclick="appendValue('*')" class="operator">*</button>
                      <button onclick="appendValue('-')" class="operator">-</button>
                      <button onclick="appendValue('7')">7</button>
                      <button onclick="appendValue('8')">8</button>
                      <button onclick="appendValue('9')">9</button>
                      <button onclick="appendValue('+')" class="operator">+</button>
                      <button onclick="appendValue('4')">4</button>
                      <button onclick="appendValue('5')">5</button>
                      <button onclick="appendValue('6')">6</button>
                      <button onclick="calculate()" class="operator" style="grid-row: span 2; height: 100%;">=</button>
                      <button onclick="appendValue('1')">1</button>
                      <button onclick="appendValue('2')">2</button>
                      <button onclick="appendValue('3')">3</button>
                      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
                      <button onclick="appendValue('.')">.</button>
                  </div>
              </div>
              <script>
                  const display = document.getElementById('display');
                  function appendValue(val) { display.value += val; }
                  function clearDisplay() { display.value = ''; }
                  function calculate() {
                      try {
                          display.value = eval(display.value);
                      } catch (e) {
                          display.value = 'Error';
                      }
                  }
              </script>
          </body>
          </html>
